name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Default is read-only. Only publish needs to create a GitHub release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-signed-tag:
    name: Require annotated signed version tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cryptographically verify the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TYPE="$(git cat-file -t "$TAG")"
          if [ "$TYPE" != "tag" ]; then
            echo "Release tags must be annotated (git tag -s vX.Y.Z), not lightweight."
            exit 1
          fi
          TAG_SHA="$(git rev-parse "$TAG")"
          VERIFIED="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.verification.verified')"
          REASON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.verification.reason')"
          if [ "$VERIFIED" != "true" ]; then
            echo "Tag $TAG is not verified by GitHub (reason=$REASON)."
            echo "Sign with a key uploaded to GitHub: git tag -s vX.Y.Z"
            exit 1
          fi
          echo "GitHub verified annotated tag $TAG ($REASON)."

  package:
    name: Package on ${{ matrix.os }}
    needs: verify-signed-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build shaded jar
        run: mvn -B -ntp -DskipTests package

      - name: Build jpackage assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          JAR="$(ls target/jvosk-*.jar | head -n 1)"
          python scripts/package-release.py --jar "$JAR" --version "$VERSION" --dest dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jvosk-${{ matrix.os }}
          path: |
            target/jvosk-*.jar
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
            dist/*.msi
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and attach installer assets
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f | sort)
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "jvosk ${GITHUB_REF_NAME}" \
            --generate-notes
